<section class="guide-section">
  <h2>Delete The Cache</h2>
  <ul>
    <li>1. open your file explorer and go to C:\Users\YOUR_PC_NAME/li>
    <li>2. Find the .Juniper folder and delete it.</li>
    <li>3. Restart the client and it should redownload all the necessary files.</li>
  </ul>
